name: Update Premium Data

on:
  # One Telegram update per trading day, after the NSE close. GitHub's cron
  # is best-effort (it often runs hours late or skips slots, worst at :00), so
  # this fires hourly at :47 UTC = :17 IST, 16:17-23:17 IST, Mon-Fri, purely as
  # retries: the first run after 16:00 IST does the work and sends the update;
  # every later run that day exits in a second.
  schedule:
    - cron: '47 10-17 * * 1-5'

  workflow_dispatch:   # manual run = fetch + send now (--force)

  push:
    branches:
      - main
    paths:
      - 'fetch_premium_data.py'

# Never let two runs race on premium_data.json / alert_state.json.
concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # keepalive

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests pandas numpy

      - name: Fetch premium data
        run: python fetch_premium_data.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING: utf-8
          # Premium zones for Telegram alerts (percent)
          BUY_BELOW: '5'
          RICH_ABOVE: '30'

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add premium_data.json alert_state.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update premium data - $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi

      - name: Summary
        run: |
          echo "## Data Update Summary" >> $GITHUB_STEP_SUMMARY
          CURRENT=$(python -c "import json; d=json.load(open('premium_data.json')); print(f\"{d['stats']['current']:.2f}% (price of {d.get('latest_date','?')})\")")
          echo "**Current Premium:** ${CURRENT}" >> $GITHUB_STEP_SUMMARY

      # If yfinance/mfapi break, the run fails; tell Telegram, not just email.
      - name: Alert on failure
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -n "$TOKEN" ] && curl -s -o /dev/null "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=⚠️ MON100 premium tracker run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true

      # GitHub disables cron workflows after 60 days without repo activity.
      # The daily data commit already counts as activity; this re-enable call
      # is a second guard in case commits ever stop (e.g. a long Yahoo outage).
      - name: Keepalive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-data.yml/enable" || true
